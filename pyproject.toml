[project]
name = "tolcad"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
gen = ["cadquery>=2.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
# WHY gen/ IS OMITTED -- DO NOT "FIX" THIS BY DELETING IT.
# Layer 1 of the suite-integrity gate (scripts/check_suite_integrity.py) measures
# branch coverage of the CHECKER CORE under the core test subset. src/tolcad/gen/
# is deliberately outside that scope: the design spec's non-goals say CadQuery
# mutants are slow and frequently geometrically meaningless, so gen/ is covered by
# Layer 3 (declared mutations) instead, which is where its historical instances
# actually lived. Leaving gen/ in scope put ~222 never-exercised statements in the
# denominator and dragged the measured TOTAL from 92% down to 48%, which turned the
# pinned floor into a number core coverage could HALVE without tripping -- a floor
# that cannot fail, inside the layer built to catch exactly that. Removing this
# omit silently restores that defect.
omit = ["src/tolcad/gen/*"]

[tool.coverage.report]
# Two decimals so the pinned floor is a measurement, not a rounded one.
precision = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath includes both "src" (the installed package) and "." (repo root).
# validation/ sits deliberately outside the installed package at the repo root,
# permitting optional SolidWorks cross-checks without polluting core dependencies.
# Because pythonpath now includes ".", the runtime defence (ModuleNotFoundError when
# a core module tries `import validation`) is removed. The AST lint in
# tests/test_architecture.py is now the sole enforcement of core-vs-validation isolation.
# That lint MUST NOT be weakened; it catches direct imports, bare relative imports,
# dynamic imports (importlib, __import__), and obfuscated calls (exec, eval).
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = [
    "slow: Monte Carlo convergence checks (deselect with -m 'not slow')",
    "mutation: declared-mutation experiments; each spawns a pytest subprocess",
]
